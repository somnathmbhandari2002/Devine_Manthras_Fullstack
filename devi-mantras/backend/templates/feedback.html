<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌺 Mahārājñī — Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --saffron:#F1C338; --maroon:#7A1F1F; --kumkum:#A53A2D; --gold:#D4AF37; --ivory:#FFF7EA;
      --card-bg:rgba(255,247,234,0.75); --shadow:0 10px 30px rgba(122,31,31,0.18);
    }
    *{box-sizing:border-box}
    html,body{ margin:0; height:100%; scroll-behavior:smooth;
      background: linear-gradient(180deg, #FFF9EF 0%, #FDEFD4 100%);
      color:#4a2c2a; font-family:"Noto Serif Devanagari","Georgia",serif; 
    } 
    header{
      position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; background:linear-gradient(90deg, rgba(122,31,31,0.92), rgba(165,58,45,0.92));
      border-bottom:1px solid rgba(212,175,55,.55); backdrop-filter:blur(6px);
    }
    .brand{ display:flex; align-items:center; gap:10px; color:#fff5e1; }
    .om-symbol{ font-size:28px; color:#ffdd00; }
    .title{ font-family:"Cinzel",serif; font-size:20px; letter-spacing:1px; }
    .btn{ background:linear-gradient(180deg,var(--saffron),#E6B52C); color:#3b240b; border:none;
      padding:10px 18px; border-radius:10px; font-weight:700; cursor:pointer;
      box-shadow:0 6px 16px rgba(241,195,56,.35);
    }

    .hero{ text-align:center; padding:40px 20px;
      background:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop') no-repeat center/cover;
      position:relative;
    }
    .hero::after{ content:""; position:absolute; inset:0; background:rgba(255,255,255,0.55); }
    .hero-inner{ position:relative; z-index:1; }
    .hero h1{ font-family:"Cinzel",serif; font-size:clamp(28px,4.5vw,42px); color:#5a1010; margin:0; }

    .container{ max-width:760px; margin:30px auto; padding:0 20px; }
    .section{ background:var(--card-bg); border:1px solid rgba(212,175,55,.35);
      border-radius:16px; box-shadow:var(--shadow); backdrop-filter:blur(6px);
      padding:24px; margin-bottom:22px; 
    }
    .section h2{ margin-top:0; font-family:"Cinzel",serif; color:#5a1010; }
    form{ display:grid; gap:16px; }
    label{ font-weight:700; color:#5a1010; }
    input,textarea{ width:100%; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(165,58,45,.35); font-family:inherit; font-size:15px;
      background:rgba(255,255,255,0.85);
    }
    textarea{ resize:vertical; min-height:120px; }
    .submit-btn{ justify-self:start; }

    /* Feedback table */
    table{ width:100%; border-collapse:collapse; margin-top:20px; }
    th,td{ border:1px solid #ccc; padding:8px; text-align:left; }
    th{ background:var(--saffron); color:#3b240b; }

    /* Ticker */
    .ticker{ position:sticky; bottom:0; z-index:10; display:flex; gap:16px; align-items:center; overflow:hidden;
      background:linear-gradient(90deg, rgba(122,31,31,0.95), rgba(165,58,45,0.95));
      border-top:1px solid rgba(212,175,55,.55); color:#fff; padding:8px 12px; }
    .ticker small{ color:#ffe8b0 } 
    .marquee{ white-space:nowrap; overflow:hidden; width:100%; } 
    .marquee span{ display:inline-block; padding-left:100%; animation:scroll 22s linear infinite; }
    @keyframes scroll{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="om-symbol">ॐ</span><div class="title">Mahārājñī</div></div>
    <button class="btn" id="adminLoginBtn">Admin Login</button>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Share Your Feedback</h1>
    </div>
  </section>

  <main class="container">
    <!-- Feedback form -->
    <section class="section">
      <h2>We Value Your Thoughts</h2>
      <form id="feedbackForm">
        <div>
          <label for="name">Your Name *</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div>
          <label for="email">Your Email *</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div>
          <label for="message">Feedback *</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn submit-btn">Submit Feedback</button>
      </form>
      <p id="status" style="margin-top:12px;font-weight:700;color:#7a1f1f;"></p>
    </section>

    <!-- Admin login form (hidden initially) -->
    <section class="section" id="adminSection" style="display:none;">
      <h2>Admin Login</h2>
      <form id="adminForm">
        <div>
          <label for="adminUser">Username</label>
          <input type="text" id="adminUser" required />
        </div>
        <div>
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" required />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p id="adminStatus" style="margin-top:12px;font-weight:700;color:#7a1f1f;"></p>
    </section>

    <!-- View feedback (hidden until login) -->
    <section class="section" id="viewFeedbackSection" style="display:none;">
      <h2>All Feedback</h2>
      <button class="btn" id="viewBtn">View Feedback</button>
      <div id="feedbackTable"></div>
    </section>
  </main>

  <div class="ticker" aria-hidden="true">
    <small>ॐ देवी ನಮಃ • </small>
    <div class="marquee"><span>:|| ಇಚ್ಛಾ ಶಕ್ತಿ ಜ್ಞಾನ ಶಕ್ತಿ ಕ್ರಿಯಾ ಶಕ್ತಿ ಸ್ವರೂಪಿಣೀ ||:</span></div>
  </div>

  <script>
    const API = "https://manthras-7.onrender.com"; // Update if deployed

    // Feedback submission
    const feedbackForm = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('status');
    feedbackForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      statusEl.textContent = 'Submitting...';
      try{
        const fd = new FormData(feedbackForm);
        const res = await fetch(API+'/feedback',{ method:'POST', body:fd });
        if(!res.ok) throw new Error(await res.text());
        statusEl.textContent = '🙏 Thank you for your feedback!';
        feedbackForm.reset();
      }catch(err){
        statusEl.textContent = '⚠️ Error: '+err.message;
      }
    });

    // Show admin login form
    document.getElementById('adminLoginBtn').addEventListener('click',()=>{
      document.getElementById('adminSection').style.display='block';
    });

    // Admin login
    let adminCreds = null;
    document.getElementById('adminForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const username = document.getElementById('adminUser').value;
      const password = document.getElementById('adminPass').value;
      try{
        // Try fetching feedback to validate creds
        const res = await fetch(`${API}/feedback?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        if(!res.ok) throw new Error("Unauthorized");
        adminCreds = {username,password};
        document.getElementById('adminStatus').textContent = "✅ Login successful";
        document.getElementById('viewFeedbackSection').style.display = 'block';
      }catch(err){
        document.getElementById('adminStatus').textContent = "⚠️ Invalid credentials";
      }
    });

    // View feedback
    document.getElementById('viewBtn').addEventListener('click', async ()=>{
      if(!adminCreds) return;
      const out = document.getElementById('feedbackTable');
      out.innerHTML = "Loading...";
      try{
        const res = await fetch(`${API}/feedback?username=${encodeURIComponent(adminCreds.username)}&password=${encodeURIComponent(adminCreds.password)}`);
        if(!res.ok) throw new Error("Unauthorized");
        const data = await res.json();
        if(data.length===0){ out.innerHTML="<p>No feedback yet (older than 30 days auto-deleted).</p>"; return; }
        let html = "<table><tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr>";
        data.forEach(f=>{
          html+=`<tr><td>${f.name}</td><td>${f.email}</td><td>${f.message}</td><td>${f.created_at? new Date(f.created_at).toLocaleDateString():"-"}</td></tr>`;
        });
        html+="</table>";
        out.innerHTML = html;
      }catch(err){
        out.innerHTML = "⚠️ Error loading feedback";
      }
    });
  </script>
</body>
</html>
